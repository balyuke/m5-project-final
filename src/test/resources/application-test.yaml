spring.cache.type: none
spring:
  init:
    mode: always
  #  datasource:
  #    url: jdbc:postgresql://localhost:5433/jira-test
  #    username: jira
  #    password: JiraRush
  datasource:
    url: jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=KEY,VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  liquibase:
    changeLog: "classpath:db/changelog-test.xml"

  jpa:
    hibernate:
      #      ddl-auto: create-drop
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect


  logging:
    level:
      liquibase: DEBUG
      org.hibernate.SQL: DEBUG
      org.hibernate.type.descriptor.sql.BasicBinder: TRACE