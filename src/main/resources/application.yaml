#  https://docs.spring.io/spring-boot/how-to/data-initialization.html
#  https://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
app:
  host-url: http://localhost:8080
  test-mail: ${TEST_MAIL}
  templates-update-cache: 5s
  mail-sending-props:
    core-pool-size: 8
    max-pool-size: 100

spring:

  config:
    import: ./application-secrets.yaml

  messages:
    basename: locale/messages
    encoding: UTF-8

  sql:
    init:
      mode: always

  init:
    mode: never

  jpa:
#    defer-datasource-initialization: true
    show-sql: true
    open-in-view: false

    # validate db by model
    hibernate:
#      ddl-auto: create-drop
#      ddl-auto: validate
      ddl-auto: validate

    properties:
      #  http://docs.jboss.org/hibernate/orm/5.3/userguide/html_single/Hibernate_User_Guide.html#configurations
      hibernate:
#        default_schema: jira
        format_sql: true
        default_batch_fetch_size: 20
        # https://stackoverflow.com/questions/21257819/what-is-the-difference-between-hibernate-jdbc-fetch-size-and-hibernate-jdbc-batc
        jdbc.batch_size: 20

  datasource:
    # for docker
    #    url: jdbc:postgresql://db-prod:5432/jira
#    url: jdbc:postgresql://localhost:5432/jira
#    username: jira
#    password: JiraRush

    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  liquibase:
    changeLog: "classpath:db/changelog.xml"
#    defaultSchema: jira

  # Jackson Fields Serialization
  jackson:
    visibility:
      field: any
      getter: none
      setter: none
      is-getter: none

  # https://docs.spring.io/spring-boot/docs/current/reference/html/appendix-application-properties.html#common-application-properties-cache
  cache:
    cache-names: users
    caffeine.spec: maximumSize=10000,expireAfterAccess=5m

  security:
    oauth2:
      client:
        registration:
          github:
            #            client-id: 3d0d8738e65881fff266
            #            client-secret: 0f97031ce6178b7dfb67a6af587f37e222a16120
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - email
          google:
            #            client-id: 329113642700-f8if6pu68j2repq3ef6umd5jgiliup60.apps.googleusercontent.com
            #            client-secret: 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
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
          gitlab:
            #            client-id: b8520a3266089063c0d8261cce36971defa513f5ffd9f9b7a3d16728fc83a494
            #            client-secret: e72c65320cf9d6495984a37b0f9cc03ec46be0bb6f071feaebbfe75168117004
            #            client-name: GitLab
            client-id: ${GITLAB_CLIENT_ID}
            client-secret: ${GITLAB_CLIENT_SECRET}
            client-name: ${GITLAB_CLIENT_NAME}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            scope: read_user
        provider:
          gitlab:
            #            authorization-uri: https://gitlab.com/oauth/authorize
            #            token-uri: https://gitlab.com/oauth/token
            #            user-info-uri: https://gitlab.com/api/v4/user
            #            user-name-attribute: email
            authorization-uri: ${PROVIDER_GITLAB_AUTHORIZATION_URI}
            token-uri: ${PROVIDER_GITLAB_TOKEN_URI}
            user-info-uri: ${PROVIDER_GITLAB_USER_INFO_URI}
            user-name-attribute: ${PROVIDER_GITLAB_USER_NAME_ATTRIBUTE}

  mail:
    properties:
      mail:
        smtp:
          starttls:
            enable: true
          auth: true
    #    host: smtp.gmail.com
    #    username: jira4jr@gmail.com
    #    password: zdfzsrqvgimldzyj
    #    port: 587
    host: ${SPRING_MAIL_HOST}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    port: ${SPRING_MAIL_PORT}
  thymeleaf.check-template-location: false

  mvc.throw-exception-if-no-handler-found: true
  web.resources.add-mappings: false

logging:
  level:
    root: WARN
    com.javarush.jira: DEBUG
    com.javarush.jira.common.config.MvcConfig: WARN
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: DEBUG

server:
  #  https://springdoc.org/index.html#how-can-i-deploy-springdoc-openapi-ui-behind-a-reverse-proxy
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8 # Charset of HTTP requests and responses. Added to the "Content-Type" header if not set explicitly
      enabled: true # Enable http encoding support
      force: true
springdoc.swagger-ui.path: /doc
